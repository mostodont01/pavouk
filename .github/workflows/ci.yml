name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libs for Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install PySide6-Essentials pytest pytest-qt
      - run: python -m pytest -q

  windows-exe:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PySide6-Essentials pyinstaller pytest pytest-qt
      - name: Tests on Windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build Pavouk.exe
        run: pyinstaller --noconfirm --onefile --windowed --name Pavouk --add-data "pavouk/Main.qml:pavouk" pavouk/__main__.py
      - name: Smoke test (start the exe, open the window, quit)
        shell: pwsh
        timeout-minutes: 3
        run: |
          $p = Start-Process -FilePath dist\Pavouk.exe -ArgumentList '--smoke','--stav',"$env:RUNNER_TEMP\smoke.json" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "Pavouk.exe did not exit" }
          if ($p.ExitCode -ne 0) { throw "Pavouk.exe exited with $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Pavouk-windows
          path: dist/Pavouk.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Pavouk.exe
